<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DIVY ASHISH YOGA SANSTHAN</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // Stores the full path in sessionStorage, then redirects to the base.
    var l = window.location;
    sessionStorage.setItem('spa_redirect', l.pathname.slice(1) + l.search + l.hash);
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/D.A.Y.S/');
  </script>
</head>
<body></body>
</html>
