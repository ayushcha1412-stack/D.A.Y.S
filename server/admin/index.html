<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DAYS Yoga — Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060e09;--surface:#0d1f12;--surface2:#142a18;--border:#1e3a22;
  --gold:#d4a843;--gold-light:#f5d98b;--cream:#f0e8d0;
  --red:#c0392b;--text:#c8d8c0;--muted:#6a8870;
  --radius:10px;--shadow:0 4px 24px rgba(0,0,0,.5);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold);text-decoration:none}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;background:radial-gradient(ellipse 70% 60% at 50% 40%,#0d2618,#020704)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-card h1{color:var(--gold);font-size:1.4rem;margin-bottom:.25rem}
.login-card p{color:var(--muted);font-size:.85rem;margin-bottom:2rem}

/* Form elements */
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{width:100%;padding:.6rem .85rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--cream);font-size:.88rem;outline:none;transition:border .2s;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{width:auto;margin-right:.35rem}
input[type=file]{padding:.4rem .5rem}
.form-group{margin-bottom:1rem}
.err{color:#e74c3c;font-size:.78rem;margin-top:.25rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.55rem 1.1rem;border:none;border-radius:var(--radius);cursor:pointer;font-size:.83rem;font-weight:600;transition:all .18s}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{background:var(--gold-light)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.82}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:.35rem .7rem;font-size:.76rem}
.btn-success{background:#115c45;color:#a8f0d0}
.btn-success:hover{background:#0d4a38}

/* Layout */
#app{flex:1;display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}

/* Sidebar */
#sidebar{width:215px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
#sidebar .logo{padding:1.2rem 1rem;border-bottom:1px solid var(--border)}
#sidebar .logo h2{color:var(--gold);font-size:.9rem;font-weight:700}
#sidebar .logo p{color:var(--muted);font-size:.68rem;margin-top:.15rem}
#sidebar nav{padding:.5rem 0;flex:1}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;cursor:pointer;font-size:.83rem;color:var(--muted);transition:all .15s;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--gold);border-left-color:var(--gold)}
.nav-icon{font-size:.95rem;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:.63rem;padding:.1rem .4rem;font-weight:700;min-width:18px;text-align:center}
.sidebar-footer{padding:.9rem;border-top:1px solid var(--border)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
#topbar h1{font-size:1rem;color:var(--cream);font-weight:600;white-space:nowrap}
#content{flex:1;overflow-y:auto;padding:1.4rem}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.9rem;margin-bottom:1.8rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;position:relative;overflow:hidden;cursor:default}
.stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,67,.05),transparent);pointer-events:none}
.stat-card .s-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.stat-card .s-value{font-size:1.9rem;font-weight:700;color:var(--gold);line-height:1}
.s-badge{display:inline-block;background:rgba(192,57,43,.2);color:#e74c3c;border:1px solid rgba(192,57,43,.3);border-radius:999px;font-size:.67rem;padding:.1rem .45rem;margin-top:.3rem}

/* Cards / Tables */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.4rem;overflow:hidden}
.card-header{padding:.9rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.card-header h3{font-size:.9rem;color:var(--cream);font-weight:600}
.card-body{padding:1.2rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{text-align:left;padding:.5rem .7rem;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.55rem .7rem;border-bottom:1px solid rgba(30,58,34,.4);vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* Tags */
.tag{display:inline-block;padding:.14rem .45rem;border-radius:999px;font-size:.7rem;font-weight:600}
.tag-new{background:rgba(26,108,168,.2);color:#3498db;border:1px solid rgba(26,108,168,.3)}
.tag-pending{background:rgba(212,168,67,.15);color:var(--gold);border:1px solid rgba(212,168,67,.25)}
.tag-active{background:rgba(17,92,69,.3);color:#2ecc71;border:1px solid rgba(17,92,69,.4)}
.tag-closed,.tag-expired,.tag-cancelled{background:rgba(100,100,100,.2);color:#888;border:1px solid rgba(100,100,100,.25)}
.tag-read,.tag-replied{background:rgba(30,58,34,.4);color:var(--muted);border:1px solid var(--border)}
.tag-no{background:rgba(192,57,43,.15);color:#e74c3c;border:1px solid rgba(192,57,43,.25)}
.tag-yes{background:rgba(17,92,69,.3);color:#2ecc71;border:1px solid rgba(17,92,69,.4)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{color:var(--cream);font-size:.95rem;font-weight:600}
.modal-body{padding:1.4rem}
.modal-footer{padding:.9rem 1.4rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end}
.close-x{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1;padding:.1rem .3rem}
.close-x:hover{color:var(--cream)}

/* Toast */
#toast-wrap{position:fixed;bottom:1.4rem;right:1.4rem;z-index:999;display:flex;flex-direction:column;gap:.45rem}
.toast{padding:.7rem 1.1rem;border-radius:var(--radius);font-size:.83rem;font-weight:500;animation:toastIn .22s ease;box-shadow:var(--shadow);max-width:300px}
.toast-ok{background:#0d3d28;color:#a8f0d0;border:1px solid rgba(46,204,113,.25)}
.toast-err{background:#3d0d0d;color:#f0a8a8;border:1px solid rgba(192,57,43,.35)}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}

/* Misc */
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.flex{display:flex}.gap{gap:.6rem}.items-center{align-items:center}.justify-between{justify-content:space-between}
.text-muted{color:var(--muted)}.text-gold{color:var(--gold)}.text-sm{font-size:.8rem}
.text-red{color:#e74c3c}.mt1{margin-top:.6rem}.mb1{margin-bottom:.6rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.88rem}
.mr1{margin-right:.4rem}
.actions{display:flex;gap:.35rem;align-items:center}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}
@media(max-width:580px){#sidebar{position:fixed;z-index:100;transform:translateX(-100%)}#sidebar.open{transform:none}}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <h1>DAYS Admin</h1>
    <p>DIVY ASHISH YOGA SANSTHAN — Dashboard</p>
    <div class="form-group">
      <label>Email</label>
      <input id="l-email" type="email" placeholder="admin@anyogainstitute.org" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="l-pwd" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <div id="l-err" class="err"></div>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="layout">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="logo">
        <h2>DAYS Admin</h2>
        <p>AN Yoga Institute</p>
      </div>
      <nav id="nav">
        <div class="nav-item active" data-page="dashboard"   onclick="goTo('dashboard')">  <span class="nav-icon">📊</span> Dashboard</div>
        <div class="nav-item"        data-page="enquiries"   onclick="goTo('enquiries')">  <span class="nav-icon">✉️</span>  Enquiries   <span class="nav-badge" id="nb-eq" style="display:none"></span></div>
        <div class="nav-item"        data-page="memberships" onclick="goTo('memberships')"><span class="nav-icon">🎫</span> Memberships <span class="nav-badge" id="nb-ms" style="display:none"></span></div>
        <div class="nav-item"        data-page="reviews"     onclick="goTo('reviews')">    <span class="nav-icon">⭐</span>  Reviews     <span class="nav-badge" id="nb-rv" style="display:none"></span></div>
        <div class="nav-item"        data-page="facilitators"onclick="goTo('facilitators')"><span class="nav-icon">🧘</span> Facilitators</div>
        <div class="nav-item"        data-page="gallery"     onclick="goTo('gallery')">    <span class="nav-icon">🖼️</span>  Gallery</div>
        <div class="nav-item"        data-page="classes"     onclick="goTo('classes')">    <span class="nav-icon">📚</span>  Classes</div>
        <div class="nav-item"        data-page="plans"       onclick="goTo('plans')">      <span class="nav-icon">💎</span>  Plans</div>
        <div class="nav-item"        data-page="achievements"onclick="goTo('achievements')"><span class="nav-icon">🏆</span> Achievements</div>
        <div class="nav-item"        data-page="schedule"    onclick="goTo('schedule')">   <span class="nav-icon">🕐</span>  Schedule</div>
        <div class="nav-item"        data-page="payments"    onclick="goTo('payments')">   <span class="nav-icon">💳</span>  Payments    <span class="nav-badge" id="nb-pay" style="display:none"></span></div>
        <div class="nav-item"        data-page="config"      onclick="goTo('config')">     <span class="nav-icon">⚙️</span>  Site Config</div>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost" style="width:100%;font-size:.8rem" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <!-- Main -->
    <div id="main">
      <div id="topbar">
        <h1 id="page-title">Dashboard</h1>
        <span id="admin-name" class="text-muted text-sm"></span>
      </div>
      <div id="content"><p class="text-muted" style="padding:2rem">Loading…</p></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="overlayClose(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="m-title">—</h3>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-footer" id="m-footer"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toast-wrap"></div>

<script>
/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
const API = '/api';
let TOKEN = localStorage.getItem('days_token') || '';
let editId = null;

/* ════════════════════════════════════════
   UTILS
════════════════════════════════════════ */
function toast(msg, ok = true) {
  const d = document.createElement('div');
  d.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  d.textContent = msg;
  document.getElementById('toast-wrap').appendChild(d);
  setTimeout(() => d.remove(), 3600);
}

async function api(path, method = 'GET', body = null, form = false) {
  const h = { Authorization: 'Bearer ' + TOKEN };
  const o = { method, headers: h };
  if (body && !form) { h['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  if (body &&  form) { o.body = body; }
  const r = await fetch(API + path, o);
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || 'Error ' + r.status);
  return d;
}

const fmt = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function tag(s) {
  const m = {new:'tag-new',pending:'tag-pending',active:'tag-active',closed:'tag-closed',expired:'tag-expired',cancelled:'tag-cancelled',read:'tag-read',replied:'tag-replied'};
  return `<span class="tag ${m[s]||'tag-new'}">${esc(s)}</span>`;
}

function openModal(title, body, footer) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-body').innerHTML = body;
  document.getElementById('m-footer').innerHTML = footer || `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function overlayClose(e) { if (e.target === document.getElementById('modal')) closeModal(); }

function v(id) { return document.getElementById(id)?.value || ''; }
function chk(id) { return document.getElementById(id)?.checked; }

/* ════════════════════════════════════════
   AUTH
════════════════════════════════════════ */
async function doLogin() {
  document.getElementById('l-err').textContent = '';
  try {
    const d = await api('/auth/admin/login', 'POST', {
      email:    document.getElementById('l-email').value.trim(),
      password: document.getElementById('l-pwd').value,
    });
    TOKEN = d.token;
    localStorage.setItem('days_token', TOKEN);
    document.getElementById('admin-name').textContent = d.admin.name;
    show();
  } catch(e) {
    document.getElementById('l-err').textContent = e.message;
  }
}

document.getElementById('l-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function show() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  goTo('dashboard');
}

function logout() {
  TOKEN = '';
  localStorage.removeItem('days_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

/* ── Auto-login on page load ───────────────────────────
   FIX: verify that the stored token belongs to an admin
   (role check) before showing the dashboard.
──────────────────────────────────────────────────────── */
if (TOKEN) {
  api('/auth/me').then(d => {
    /* Reject if the token is a regular user token */
    if (!d.user || d.user.role !== 'admin') {
      TOKEN = '';
      localStorage.removeItem('days_token');
      return;
    }
    document.getElementById('admin-name').textContent = d.user.name || 'Admin';
    show();
  }).catch(() => {
    TOKEN = '';
    localStorage.removeItem('days_token');
  });
}

/* ════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════ */
const PAGE_TITLES = {
  dashboard:'Dashboard', enquiries:'Enquiries', memberships:'Memberships',
  reviews:'Reviews', facilitators:'Facilitators', gallery:'Gallery',
  classes:'Classes', plans:'Plans', achievements:'Achievements',
  schedule:'Schedule', config:'Site Config', payments:'Payments',
};

function goTo(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  const map = {
    dashboard:renderDashboard, enquiries:renderEnquiries, memberships:renderMemberships,
    reviews:renderReviews, facilitators:renderFacilitators, gallery:renderGallery,
    classes:renderClasses, plans:renderPlans, achievements:renderAchievements,
    schedule:renderSchedule, config:renderConfig, payments:renderPayments,
  };
  (map[page] || (() => {}))();
}

/* ════════════════════════════════════════
   DASHBOARD
════════════════════════════════════════ */
async function renderDashboard() {
  document.getElementById('content').innerHTML = '<p class="text-muted text-sm" style="padding:1rem">Loading stats…</p>';
  try {
    const { data: s } = await api('/config/stats');
    setBadge('nb-eq', s.newEnquiries);
    setBadge('nb-ms', s.pendingMemberships);
    setBadge('nb-rv', s.pendingReviews);
    document.getElementById('content').innerHTML = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="s-label">Enquiries</div>
          <div class="s-value">${s.enquiries}</div>
          ${s.newEnquiries ? `<div class="s-badge">${s.newEnquiries} new</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="s-label">Memberships</div>
          <div class="s-value">${s.memberships}</div>
          ${s.pendingMemberships ? `<div class="s-badge">${s.pendingMemberships} pending</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="s-label">Reviews</div>
          <div class="s-value">${s.reviews}</div>
          ${s.pendingReviews ? `<div class="s-badge">${s.pendingReviews} awaiting</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="s-label">Facilitators</div>
          <div class="s-value">${s.facilitators}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Quick Actions</h3></div>
        <div class="card-body" style="display:flex;flex-wrap:wrap;gap:.6rem">
          <button class="btn btn-ghost btn-sm" onclick="goTo('enquiries')">✉️ Enquiries</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('memberships')">🎫 Registrations</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('reviews')">⭐ Reviews</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('gallery')">🖼️ Gallery</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('facilitators')">🧘 Facilitators</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('classes')">📚 Classes</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('plans')">💎 Plans</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('achievements')">🏆 Achievements</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('schedule')">🕐 Schedule</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('config')">⚙️ Site Config</button>
          <button class="btn btn-ghost btn-sm" onclick="goTo('payments')">💳 Payments</button>
        </div>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p class="err" style="padding:1rem">${esc(e.message)}</p>`;
  }
}

function setBadge(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n; el.style.display = 'inline-block'; }
  else el.style.display = 'none';
}

/* ════════════════════════════════════════
   ENQUIRIES
════════════════════════════════════════ */
async function renderEnquiries() {
  document.getElementById('content').innerHTML = '<p class="text-muted text-sm" style="padding:1rem">Loading…</p>';
  try {
    const { data } = await api('/contact');
    // Update sidebar badge with live count of 'new' enquiries
    const newCount = data.filter(e => e.status === 'new').length;
    setBadge('nb-eq', newCount);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="card-header"><h3>All Enquiries (${data.length})</h3></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Service</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>${data.length ? data.map(e => `
            <tr>
              <td class="text-muted">${fmt(e.createdAt)}</td>
              <td>${esc(e.name)}</td>
              <td>${esc(e.phone)}</td>
              <td class="text-muted">${esc(e.service)}</td>
              <td>${tag(e.status)}</td>
              <td class="actions">
                <button class="btn btn-ghost btn-sm" onclick="viewEnquiry('${e._id}')">View</button>
                <button class="btn btn-danger btn-sm" onclick="del('/contact','${e._id}',renderEnquiries)">Del</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="6" class="empty">No enquiries yet.</td></tr>'}</tbody>
        </table></div>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p class="err" style="padding:1rem">${esc(e.message)}</p>`;
  }
}

async function viewEnquiry(id) {
  try {

/* ════════════════════════════════════════
   REVIEWS
   FIX: GET /reviews now uses optionalAuth on the server,
   so sending the admin Bearer token returns ALL reviews
   (including unapproved), making viewRev() work correctly
   for pending reviews.
════════════════════════════════════════ */

/* Cache the loaded reviews list so viewRev() can look up
   any review (including unapproved) without a second request */
let _reviewsCache = [];

async function renderReviews() {
  document.getElementById('content').innerHTML = '<p class="text-muted text-sm" style="padding:1rem">Loading…</p>';
  try {
    const { data } = await api('/reviews');
    _reviewsCache = data; // cache for viewRev
    // Update sidebar badge with live count of unapproved reviews
    const pendingRevCount = data.filter(r => !r.approved).length;
    setBadge('nb-rv', pendingRevCount);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="card-header"><h3>Reviews (${data.length})</h3></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Name</th><th>Rating</th><th>Category</th><th>Approved</th><th>Actions</th></tr></thead>
          <tbody>${data.length ? data.map(r => `
            <tr>
              <td class="text-muted">${fmt(r.createdAt)}</td>
              <td>${esc(r.name)}</td>
              <td>${'⭐'.repeat(r.rating)}</td>
              <td class="text-muted">${esc(r.category||'—')}</td>
              <td><span class="tag ${r.approved ? 'tag-yes' : 'tag-no'}">${r.approved ? 'Yes' : 'No'}</span></td>
              <td class="actions">
                ${!r.approved ? `<button class="btn btn-success btn-sm mr1" onclick="approveRev('${r._id}')">Approve</button>` : ''}
                <button class="btn btn-ghost btn-sm mr1" onclick="viewRev('${r._id}')">View</button>
                <button class="btn btn-danger btn-sm" onclick="del('/reviews','${r._id}',renderReviews)">Del</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="6" class="empty">No reviews yet.</td></tr>'}</tbody>
        </table></div>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p class="err" style="padding:1rem">${esc(e.message)}</p>`;
  }
}

function viewRev(id) {
  /* Use the cache set by renderReviews — includes unapproved reviews */
  const rev = _reviewsCache.find(x => x._id === id);
  if (!rev) { toast('Review not found — please refresh.', false); return; }
  openModal('Review by ' + esc(rev.name), `
    <p class="text-sm text-muted mb1">${'⭐'.repeat(rev.rating)} · ${esc(rev.category||'—')} · ${fmt(rev.createdAt)}</p>
    <p class="text-sm" style="white-space:pre-wrap">${esc(rev.review)}</p>`,
    `${!rev.approved ? `<button class="btn btn-success mr1" onclick="approveRev('${id}')">Approve</button>` : ''}
     <button class="btn btn-danger mr1" onclick="del('/reviews','${id}',()=>{closeModal();renderReviews()})">Delete</button>
     <button class="btn btn-ghost" onclick="closeModal()">Close</button>`
  );
}

async function approveRev(id) {
  try {
    await api('/reviews/' + id + '/approve', 'PUT');
    toast('Review approved ✓');
    closeModal();
    renderReviews();
  } catch(e) { toast(e.message, false); }
}

async function doUpload(endpoint, fileInputId, onDone) {
  const file = document.getElementById(fileInputId)?.files[0];
  if (!file) return toast('Select a file first.', false);
  const fd = new FormData();
  fd.append('image', file);
  try {
    await api(endpoint, 'POST', fd, true);
    toast('Uploaded ✓');
    closeModal();
    onDone();
  } catch(e) { toast(e.message, false); }
}

async function saveGallery(isEdit) {
  try {
    const common = {
      title:    v('gf-title'),
      alt:      v('gf-alt'),
      category: v('gf-cat'),
      order:    Number(v('gf-ord')),
      featured: chk('gf-feat'),
    };
    if (isEdit) {
      await api('/gallery/' + editId, 'PUT', common);
    } else {
      const file = document.getElementById('gf-file')?.files[0];
      if (!file) return toast('Select an image.', false);
      const fd = new FormData();
      Object.entries(common).forEach(([k, val]) => fd.append(k, val));
      fd.append('image', file);
      await api('/gallery', 'POST', fd, true);
    }
    toast('Saved ✓');
    closeModal();
    renderGallery();
  } catch(e) { toast(e.message, false); }
}

      <div class="card">
        <div class="card-header">
          <h3>UPI Payments (${data.length})</h3>
          <span class="text-muted text-sm">UPI ID: ashishku325@okhdfcbank</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Plan</th><th>Amount</th><th>Status</th><th>UTR</th><th>Actions</th></tr></thead>
          <tbody>${data.length ? data.map(p => `
            <tr>
              <td class="text-muted">${fmt(p.createdAt)}</td>
              <td>${esc(p.name)}</td>
              <td>${esc(p.phone)}</td>
              <td class="text-muted" style="max-width:140px;white-space:normal">${esc(p.planLabel)}</td>

              <td class="text-muted">${esc(p.utrNumber || '—')}</td>

                ${p.status === 'created' ? `<button class="btn btn-success btn-sm" onclick="confirmPayment('${p.orderId}')">✓ Confirm</button>` : ''}
                <button class="btn btn-ghost btn-sm" onclick="viewPayment(${JSON.stringify(p).replace(/"/g,'&quot;')})">View</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="8" class="empty">No payments yet.</td></tr>'}</tbody>
        </table></div>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p class="err" style="padding:1rem">${esc(e.message)}</p>`;
  }
}

function payTag(s) {
  const m = { created:'tag-pending', paid:'tag-active', failed:'tag-no', expired:'tag-closed' };
  return `<span class="tag ${m[s]||'tag-new'}">${esc(s)}</span>`;
}

function viewPayment(p) {
  openModal(`Payment — ${esc(p.name)}`, `
    <p class="text-sm mb1"><strong>${esc(p.name)}</strong> · ${esc(p.phone)}</p>
    <p class="text-sm text-muted mb1">Plan: ${esc(p.planLabel)} · Duration: ${esc(p.duration)}</p>
    <p class="text-sm mb1">Amount: <strong class="text-gold">₹${p.amountRupees}</strong> · Status: ${payTag(p.status)}</p>
    <p class="text-sm text-muted mb1">Order ID: ${esc(p.orderId)}</p>
    ${p.utrNumber ? `<p class="text-sm mb1">UTR: <strong>${esc(p.utrNumber)}</strong></p>` : ''}
    ${p.timing ? `<p class="text-sm text-muted mb1">Preferred timing: ${esc(p.timing)}</p>` : ''}
    <hr class="divider"/>
    ${p.status === 'created' ? `
    <div class="form-group"><label>UTR / Transaction Reference *</label>
      <input id="utr-input" placeholder="e.g. 123456789012" style="font-family:monospace"/>
      <div class="err" id="utr-err"></div>
    </div>` : ''}`,
    p.status === 'created' ? `
      <button class="btn btn-success" onclick="confirmPaymentModal('${esc(p.orderId)}')">✓ Confirm Payment</button>
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>` :
      `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`
  );
}

async function confirmPayment(orderId) {
  const utr = prompt('Enter UTR / Transaction Reference number:');
  if (!utr?.trim()) return;
  try {
    await api('/payment/confirm', 'POST', { orderId, utrNumber: utr.trim() });
    toast('Payment confirmed ✓');
    renderPayments();
  } catch(e) { toast(e.message, false); }
}

async function confirmPaymentModal(orderId) {
  const utr = document.getElementById('utr-input')?.value?.trim();
  if (!utr) { document.getElementById('utr-err').textContent = 'UTR is required'; return; }
  try {
    await api('/payment/confirm', 'POST', { orderId, utrNumber: utr });
    toast('Payment confirmed ✓');
    closeModal();
    renderPayments();
  } catch(e) { toast(e.message, false); }
}

function del(endpoint, id, onDone) {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  api(endpoint + '/' + id, 'DELETE')
    .then(() => { toast('Deleted ✓'); if (typeof onDone === 'function') onDone(); })
    .catch(e => toast(e.message, false));
}
</script>
